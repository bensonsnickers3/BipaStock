<style>
:root{--bg:#f3f5fa;--cd:#fff;--tx:#10203a;--mu:#64708a;--pr:#1d4ed8;--ok:#15803d;--bad:#dc2626;--wa:#d97706;--bd:#dce2ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1322;--cd:#152038;--tx:#e8edf8;--mu:#93a0bc;--pr:#6b97ff;--ok:#34d399;--bad:#f87171;--wa:#fbbf24;--bd:#26335a}}
:root[data-theme="dark"]{--bg:#0c1322;--cd:#152038;--tx:#e8edf8;--mu:#93a0bc;--pr:#6b97ff;--ok:#34d399;--bad:#f87171;--wa:#fbbf24;--bd:#26335a}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--cd);border-bottom:1px solid var(--bd);display:flex;gap:10px;align-items:center;padding:8px 12px}
.logo{font-weight:800;color:var(--pr);white-space:nowrap}
#loc{max-width:42%}
.me{margin-left:auto;display:flex;gap:8px;align-items:center;text-align:right;font-size:12px;cursor:pointer;line-height:1.2}
.av{flex:0 0 38px;width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--bd);display:grid;place-items:center;font-weight:700}
nav{display:flex;background:var(--cd);border-bottom:1px solid var(--bd)}
nav button{flex:1;padding:11px 4px;border:0;background:none;color:var(--mu);font-weight:600;border-bottom:3px solid transparent}
nav button.on{color:var(--pr);border-color:var(--pr)}
main{max-width:900px;margin:auto;padding:12px}
main.contar{display:flex;flex-direction:column;min-height:calc(100vh - 120px)}
.dock{margin-top:auto;position:sticky;bottom:0}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
button,select,input{font:inherit;color:var(--tx)}
.b{display:inline-block;text-align:center;cursor:pointer;background:var(--pr);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:600}
.b.g{background:none;color:var(--pr);border:1px solid var(--pr)}.b.r{background:var(--bad);color:#fff}
input,select{border:1px solid var(--bd);background:var(--bg);border-radius:8px;padding:9px;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.k{font-size:26px;font-weight:800}.mu{color:var(--mu);font-size:12px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.wa{color:var(--wa)}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:left}
.bar{height:10px;border-radius:5px}
.pimg{width:96px;height:96px;object-fit:cover;border-radius:8px;background:var(--bd);display:block}
.ov{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:9}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:20px;opacity:0;pointer-events:none;transition:.2s;z-index:10;max-width:90vw}
#toast.show{opacity:1}#toast.bad{background:var(--bad);color:#fff}
[hidden]{display:none!important}
.lg{width:30px;height:30px;border-radius:7px;flex:0 0 30px}
#rel{display:none}
@page{margin:14mm}
@media print{body>*:not(#rel){display:none!important}html,body{background:#fff!important}#rel{display:block;color:#111;font:12px/1.4 Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#rel h1{font-size:22px;margin:0;color:#1d4ed8}#rel h2{font-size:14px;margin:18px 0 6px;border-bottom:2px solid #1d4ed8;padding-bottom:3px}
#rel .kp{display:flex;gap:8px}#rel .kp div{flex:1;border:1px solid #dce2ee;border-radius:6px;padding:8px}#rel .kp b{display:block;font-size:20px}
#rel table{width:100%;border-collapse:collapse;font-size:11px}#rel th{background:#1d4ed8;color:#fff;text-align:left;padding:4px 6px}#rel td{border-bottom:1px solid #dce2ee;padding:4px 6px}#rel tr{break-inside:avoid}#rel .bar{height:8px;border-radius:4px}}

function onCode(raw){raw=String(raw).trim();if(!raw)return;if(!M.me||!loc())return toast('Selecione um local',1);const p=idx().get(nk(raw)),k=p?p.c||p.s:raw,ex=L().find(x=>x.k===k);selId=null;lastMsg='';if(ex){pend=null;dup=ex;navigator.vibrate&&navigator.vibrate([80,60,80]);paint();return toast('Produto já lançado',1)}dup=null;pend={k,n:p?p.n||p.c||p.s:'(não cadastrado)',img:p?p.i:'',q:p?p.q:0,code:raw,known:!!p,p};navigator.vibrate&&navigator.vibrate(50);const q=$('#qty');if(q)q.value=1;paint();if(p&&!p.i)autoImg(p)}

<div class="card"><b>Maiores divergências</b>${dv.slice(0,10).map(x=>`<div style="margin:8px 0"><div class="mu">${esc(x.n)} · sistema ${x.q} / contado ${x.cnt} (${x.d>0?'+':''}${x.d})</div><div class="bar" style="width:${Math.max(4,Math.abs(x.d)/mx*100)}%;background:var(${x.d>0?'--wa':'--bad'})"></div></div>`).join('')||'<div class="mu">Sem divergências até agora.</div>'}</div>

<div class="card"><div class="row" style="flex-wrap:nowrap"><b style="flex:1">Divergências (detalhe)</b><button class="b g" style="flex:0 0 auto" onclick="exportar('div')">📤 Exportar</button></div>${tbl(dv,x=>[x.k,x.n,x.q,x.cnt,(x.d>0?'+':'')+x.d,fm(x.v),fm(x.vd)],['Cód','Produto','Sist.','Cont.','Dif.','Valor unit.','Valor dif.'])}</div>`}
function vCad(){const a=adm(),l=loc(),row=(t,e,d)=>`<div class="row" style="margin:6px 0;flex-wrap:nowrap"><span style="flex:1">${t}</span>${e?`<button class="b g" style="flex:0" onclick="${e}">Editar</button>`:''}${d?`<button class="b r" style="flex:0" onclick="${d}">Excluir</button>`:''}</div>`,
fi=`<label class="b">📥 Carregar planilha<input type="file" accept=".xlsx,.xls,.csv" hidden onchange="imp(this.files[0]);this.value=''"></label>`;
return `<div class="card"><b>Planilha de: ${esc(l?l.nome:'—')}</b><p class="mu">${P().length} produtos · ${L().length} lançamentos</p><div class="row">${a?fi:''}<button class="b g" onclick="exp()">📤 Exportar contagem</button>${a?'<button class="b g" onclick="tpl()">📄 Modelo .xlsx</button><button class="b g" onclick="autoImgLote()">🖼️ Buscar imagens dos produtos</button>':''}</div>${a?'<div class="row" style="margin-top:8px"><button class="b g" onclick="clr()">Zerar contagem deste local</button></div>':'<p class="mu">Só o admin carrega planilhas e gerencia locais.</p>'}</div>
<div class="card"><b>Lojas e CDs</b>${M.locs.map(x=>row((x.tipo==='CD'?'🏭 ':'🏬 ')+esc(x.nome),a?`edLoc('${x.id}')`:'',a?`delLoc('${x.id}')`:'')).join('')}${a?'<button class="b" onclick="edLoc()">+ Novo local</button>':''}</div>
<div class="card"><b>Equipe</b><p class="mu">Cada pessoa cria a própria conta na tela de login.</p>${M.eq.map(p=>row(`<span class="row" style="flex-wrap:nowrap">${av(p)}<span style="flex:1">${esc(p.nome)}${p.admin?' ⭐':''} <span class="mu">${esc(p.cargo)}</span></span></span>`,a||p.id===M.me.id?`edPf('${p.id}')`:'','')).join('')}</div>
<div class="card"><button class="b g" onclick="out()">Sair da conta</button></div>`}
async function go(t){await stopCam();if(!M.me)return authView();tab=t||tab;if(!M.me.admin)tab='contar';$('#bout').hidden=false;const e=M.me;$('#loc').innerHTML=M.locs.map(l=>`<option value="${l.id}" ${l.id===M.loc?'selected':''}>${esc(l.tipo)} · ${esc(l.nome)}</option>`).join('')||'<option>Sem local</option>';$('#me').innerHTML=`<span><b>${esc(e.nome)}</b><br>${esc(e.cargo)}</span>${av(e)}`;
$('#nav').innerHTML=!M.me.admin?'':[['contar','📷 Contar'],['painel','📊 Painel'],['cad','⚙️ Cadastros']].map(x=>`<button class="${x[0]===tab?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');const v=$('#v');v.className=tab;v.innerHTML=tab==='contar'?vContar():tab==='painel'?vPainel():vCad();if(tab==='contar')paint();if(tab==='painel')lojas()}
init();if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
