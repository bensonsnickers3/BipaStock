<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ContaCerta — Inventário</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--bg:#f3f5fa;--cd:#fff;--tx:#10203a;--mu:#64708a;--pr:#1d4ed8;--ok:#15803d;--bad:#dc2626;--wa:#d97706;--bd:#dce2ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1322;--cd:#152038;--tx:#e8edf8;--mu:#93a0bc;--pr:#6b97ff;--ok:#34d399;--bad:#f87171;--wa:#fbbf24;--bd:#26335a}}
:root[data-theme="dark"]{--bg:#0c1322;--cd:#152038;--tx:#e8edf8;--mu:#93a0bc;--pr:#6b97ff;--ok:#34d399;--bad:#f87171;--wa:#fbbf24;--bd:#26335a}
html{background:var(--bg);scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--cd);border-bottom:1px solid var(--bd);display:flex;gap:10px;align-items:center;padding:8px 12px}
.logo{font-weight:800;color:var(--pr);white-space:nowrap}
#loc{max-width:42%}
.me{margin-left:auto;display:flex;gap:8px;align-items:center;text-align:right;font-size:12px;cursor:pointer;line-height:1.2}
.av{flex:0 0 38px;width:38px;height:38px;border-radius:50%;object-fit:cover;background:var(--bd);display:grid;place-items:center;font-weight:700}
nav{display:flex;background:var(--cd);border-bottom:1px solid var(--bd)}
nav button{flex:1;padding:11px 4px;border:0;background:none;color:var(--mu);font-weight:600;border-bottom:3px solid transparent}
nav button.on{color:var(--pr);border-color:var(--pr)}
main{max-width:900px;margin:auto;padding:12px}
main.contar{display:flex;flex-direction:column;min-height:calc(100vh - 120px)}
.dock{margin-top:auto;position:sticky;bottom:0}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
button,select,input{font:inherit;color:var(--tx)}
.b{display:inline-block;text-align:center;cursor:pointer;background:var(--pr);color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:600}
.b.g{background:none;color:var(--pr);border:1px solid var(--pr)}.b.r{background:var(--bad);color:#fff}
input,select{border:1px solid var(--bd);background:var(--bg);border-radius:8px;padding:9px;width:100%}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.k{font-size:26px;font-weight:800}.mu{color:var(--mu);font-size:12px}
.ok{color:var(--ok)}.bad{color:var(--bad)}.wa{color:var(--wa)}
.tbl{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:left}
.bar{height:10px;border-radius:5px}
.pimg{width:96px;height:96px;object-fit:cover;border-radius:8px;background:var(--bd);display:block}
.ov{position:fixed;inset:0;background:#0009;display:grid;place-items:center;z-index:9}
#toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:20px;opacity:0;pointer-events:none;transition:.2s;z-index:10}
#toast.show{opacity:1}#toast.bad{background:var(--bad);color:#fff}
</style></head><body>
<header><span class="logo">📦 ContaCerta</span><select id="loc" onchange="S.cur.l=this.value;save();go()"></select><div class="me" id="me" onclick="openLogin()"></div></header>
<nav id="nav"></nav><main id="v"></main><div id="md"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),
esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),
uid=()=>Math.random().toString(36).slice(2,9),
norm=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,''),
nk=s=>norm(s).replace(/^0+/,''),cl=()=>{$('#md').innerHTML=''};
let S={emps:[],roles:['Conferente','Supervisor','Gerente'],locs:[],cur:{e:null,l:null},prods:{},logs:{},img:{},z:0,auto:0},tab='contar',pend=null,cam=null,lastC='',lastT=0;
try{Object.assign(S,JSON.parse(localStorage.getItem('cc1')||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem('cc1',JSON.stringify(S))}catch(e){toast('Memória do navegador cheia: exporte e zere contagens antigas',1)}};
function toast(m,bad){const t=$('#toast');t.textContent=m;t.className=bad?'bad show':'show';clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='',2600)}
const emp=()=>S.emps.find(e=>e.id===S.cur.e),loc=()=>S.locs.find(l=>l.id===S.cur.l),P=()=>S.prods[S.cur.l]||[],L=()=>S.logs[S.cur.l]||[];
const av=e=>e&&e.foto?`<img class="av" src="${esc(e.foto)}" alt="">`:`<div class="av">${esc((e&&e.nome||'?')[0])}</div>`;
const tbl=(a,f,h)=>`<div class="tbl"><table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${a.map(x=>'<tr>'+f(x).map(c=>`<td>${esc(c)}</td>`).join('')+'</tr>').join('')}</table></div>`;
function idx(){const m=new Map();P().forEach(p=>[p.c,p.s].forEach(v=>v&&m.set(nk(v),p)));return m}
function counts(){const c={};L().forEach(l=>c[l.k]=(c[l.k]||0)+l.q);return c}
function rows(){const c=counts(),seen=new Set(),r=P().map(p=>{const k=p.c||p.s,q=c[k]||0;seen.add(k);return{...p,k,cnt:q,d:q-p.q}});Object.keys(c).forEach(k=>{if(!seen.has(k))r.push({k,c:k,s:'',n:'(não cadastrado)',q:0,cnt:c[k],d:c[k],x:1})});return r}
const resize=(f,m)=>new Promise(r=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,m/Math.max(i.width,i.height));c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.7))};i.onerror=()=>r('');i.src=URL.createObjectURL(f)});
function pd(v){if(!v)return'';if(v instanceof Date)return v.toISOString();const m=String(v).match(/^(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})/);if(m)return new Date(+m[3],m[2]-1,+m[1]).toISOString();const d=new Date(v);return isNaN(d)?'':d.toISOString()}

/* modal genérico */
function modal(t,fs,v,ok){v=v||{};$('#md').innerHTML=`<div class="ov"><div class="card" style="width:min(420px,92vw);max-height:90vh;overflow:auto"><b>${t}</b>${fs.map(f=>`<div class="mu" style="margin-top:8px">${f.l}</div>${f.o?`<select id="f_${f.k}">${f.o.map(o=>`<option ${o==v[f.k]?'selected':''}>${esc(o)}</option>`).join('')}</select>`:f.file?`<input id="f_${f.k}" type="file" accept="image/*">`:`<input id="f_${f.k}" value="${esc(v[f.k]||'')}">`}`).join('')}<div class="row" style="margin-top:12px"><button class="b g" onclick="cl()">Cancelar</button><button class="b" id="ok">Confirmar</button></div></div></div>`;
$('#ok').onclick=async()=>{const o={};for(const f of fs){const e=$('#f_'+f.k);o[f.k]=f.file?(e.files[0]?await resize(e.files[0],128):v[f.k]):e.value.trim()}if(await ok(o)!==false)cl()}}

/* login / perfis */
function openLogin(){$('#md').innerHTML=`<div class="ov"><div class="card" style="width:min(420px,92vw);max-height:90vh;overflow:auto"><b>Quem está contando?</b>${S.emps.map(e=>`<div class="row" style="margin:8px 0;flex-wrap:nowrap;cursor:pointer" onclick="login('${e.id}')">${av(e)}<span style="flex:1"><b>${esc(e.nome)}</b><br><span class="mu">${esc(e.cargo)}</span></span></div>`).join('')}<div class="row" style="margin-top:8px"><button class="b" onclick="edEmp(null,1)">+ Novo funcionário</button>${emp()?'<button class="b g" onclick="cl()">Fechar</button>':''}</div></div></div>`}
function login(id){S.cur.e=id;save();cl();go()}
function edEmp(id,lg){const x=S.emps.find(e=>e.id===id);modal(x?'Editar funcionário':'Novo funcionário',[{k:'nome',l:'Nome'},{k:'cargo',l:'Cargo',o:S.roles},{k:'foto',l:'Foto'+'',file:1}],x,o=>{if(!o.nome)return false;if(x)Object.assign(x,o);else{const n={id:uid(),...o};S.emps.push(n);if(lg||!S.cur.e)S.cur.e=n.id}save();go()})}
function delEmp(id){modal('Excluir funcionário?',[],{},()=>{S.emps=S.emps.filter(e=>e.id!==id);if(S.cur.e===id)S.cur.e=null;save();go()})}
function edLoc(id){const x=S.locs.find(l=>l.id===id);modal(x?'Editar local':'Novo local',[{k:'nome',l:'Nome'},{k:'tipo',l:'Tipo',o:['Loja','CD']}],x,o=>{if(!o.nome)return false;if(x)Object.assign(x,o);else{const n={id:uid(),...o};S.locs.push(n);S.cur.l=S.cur.l||n.id}save();go()})}
function delLoc(id){modal('Excluir local e a contagem dele?',[],{},()=>{S.locs=S.locs.filter(l=>l.id!==id);delete S.prods[id];delete S.logs[id];if(S.cur.l===id)S.cur.l=S.locs[0]?S.locs[0].id:null;save();go()})}
function edRole(i){const r=S.roles[i];modal(r?'Editar cargo':'Novo cargo',[{k:'n',l:'Cargo'}],{n:r},o=>{if(!o.n)return false;if(r){S.roles[i]=o.n;S.emps.forEach(e=>{if(e.cargo===r)e.cargo=o.n})}else S.roles.push(o.n);save();go()})}
function delRole(i){if(S.roles.length<2)return toast('Mantenha ao menos 1 cargo',1);modal('Excluir cargo?',[],{},()=>{S.roles.splice(i,1);save();go()})}

/* contagem */
function paint(){const a=$('#last');if(!a)return;const c=counts(),p=pend,e=emp(),who=e?esc(e.nome)+' ('+esc(e.cargo)+')':'';
a.innerHTML=p?(()=>{const im=S.img[nk(p.code)]||p.img;return `<div class="row" style="flex-wrap:nowrap"><label style="flex:0 0 96px;cursor:pointer">${im?`<img class="pimg" src="${esc(im)}" alt="">`:'<div class="pimg" style="display:grid;place-items:center;font-size:12px;text-align:center">📷 foto</div>'}<input type="file" accept="image/*" capture="environment" hidden onchange="photo(this.files[0])"></label><div style="flex:1"><b>${esc(p.n)}</b><div class="mu">Cód: ${esc(p.code)}</div><div>Sistema: <b>${p.known?p.q:'—'}</b> · Contado: <b class="ok">${c[p.k]||0}</b></div><div class="mu">${new Date().toLocaleString('pt-BR')} · ${who}</div>${p.known?'':'<div class="bad">Código fora da planilha</div>'}</div></div>`})():`<div class="mu">${P().length?'Bipe um produto para começar.':'Crie um local e carregue a planilha em ⚙️ Cadastros.'}</div>`;
$('#hist').innerHTML=tbl(L().slice(-8).reverse(),l=>[new Date(l.t).toLocaleTimeString('pt-BR'),l.n,(l.q>0?'+':'')+l.q,l.e],['Hora','Produto','Qtd','Quem'])}
async function photo(f){if(f&&pend){S.img[nk(pend.code)]=await resize(f,160);save();paint()}}
function onCode(raw){raw=String(raw).trim();if(!raw)return;if(!emp()||!loc())return toast('Selecione perfil e local',1);const p=idx().get(nk(raw));pend={k:p?p.c||p.s:raw,n:p?p.n||p.c||p.s:'(não cadastrado)',img:p?p.i:'',q:p?p.q:0,code:raw,known:!!p};navigator.vibrate&&navigator.vibrate(50);S.auto?commit(1):paint()}
function commit(q){q=parseInt(q,10);if(!pend)return toast('Bipe um produto primeiro',1);if(!q)return toast('Quantidade inválida',1);const e=emp();if(!e||!loc())return toast('Selecione perfil e local',1);(S.logs[S.cur.l]=S.logs[S.cur.l]||[]).push({t:new Date().toISOString(),k:pend.k,n:pend.n,q,e:e.nome,r:e.cargo});save();$('#qty').value=1;paint();toast('✔ '+pend.n+' '+(q>0?'+':'')+q)}
function undo(){const l=L();if(!l.length)return;l.pop();save();paint();toast('Último lançamento desfeito')}
async function stopCam(){try{if(cam){await cam.stop();cam.clear()}}catch(e){}cam=null;const b=$('#bcam');if(b)b.textContent='📷 Abrir leitor'}
async function toggleCam(){if(cam)return stopCam();if(typeof Html5Qrcode==='undefined')return toast('Leitor não carregou. Use o campo manual.',1);try{cam=new Html5Qrcode('cam',{experimentalFeatures:{useBarCodeDetectorIfSupported:true},verbose:false});await cam.start({facingMode:'environment'},{fps:10,qrbox:{width:260,height:110}},t=>{const n=Date.now();if(t===lastC&&n-lastT<1500)return;lastC=t;lastT=n;onCode(t)},()=>{});$('#bcam').textContent='⏹ Fechar leitor'}catch(e){cam=null;toast('Câmera indisponível. Libere a permissão ou use o campo manual.',1)}}

/* planilhas */
function imp(f){if(!f)return;const fr=new FileReader();fr.onload=ev=>{try{const wb=XLSX.read(ev.target.result,{type:'array',cellDates:true}),sh=n=>{const k=wb.SheetNames.find(s=>norm(s)===norm(n));return k?XLSX.utils.sheet_to_json(wb.Sheets[k],{defval:''}):null},g=(o,...ks)=>{for(const k in o)if(ks.includes(norm(k)))return o[k];return''};
(sh('Funcionarios')||[]).forEach(o=>{const n=String(g(o,'nome')).trim();if(n&&!S.emps.some(x=>x.nome===n)){const c=String(g(o,'cargo')).trim()||S.roles[0];if(!S.roles.includes(c))S.roles.push(c);S.emps.push({id:uid(),nome:n,cargo:c,foto:''})}});
[['Lojas','Loja'],['CDs','CD']].forEach(([a,t])=>(sh(a)||[]).forEach(o=>{const n=String(g(o,'nome','loja','cd')).trim();if(n&&!S.locs.some(x=>x.nome===n&&x.tipo===t))S.locs.push({id:uid(),nome:n,tipo:t})}));
S.cur.l=S.cur.l||(S.locs[0]&&S.locs[0].id);
const ps=(sh('Produtos')||XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{defval:''})).map(o=>({c:String(g(o,'codigobarras','ean','codigo','codbarras','barras','gtin')).trim(),s:String(g(o,'sku','referencia','codinterno')).trim(),n:String(g(o,'produto','nome','descricao')).trim(),i:String(g(o,'imagemurl','imagem','foto','img')).trim(),q:Number(g(o,'estoquesistema','estoque','saldo','qtd','quantidade'))||0,u:pd(g(o,'ultimavenda','datavenda'))})).filter(p=>p.c||p.s);
if(ps.length&&loc()){S.prods[S.cur.l]=ps;toast(ps.length+' produtos carregados em '+loc().nome)}else toast(ps.length?'Crie um local antes de carregar produtos':'Nenhum produto achado (veja o modelo .xlsx)',!ps.length||!loc());save();go()}catch(e){toast('Erro ao ler a planilha: '+e.message,1)}};fr.readAsArrayBuffer(f)}
function exp(){const l=loc();if(!l)return toast('Selecione um local',1);const r=rows(),w=XLSX.utils.book_new();XLSX.utils.book_append_sheet(w,XLSX.utils.json_to_sheet(r.map(x=>({codigo_barras:x.c,sku:x.s||'',produto:x.n,estoque_sistema:x.q,contado:x.cnt,diferenca:x.d,status:x.cnt||S.z?(x.d?'DIVERGENTE':'OK'):'PENDENTE'}))),'Contagem');XLSX.utils.book_append_sheet(w,XLSX.utils.json_to_sheet(L().map(x=>({data_hora:new Date(x.t).toLocaleString('pt-BR'),local:l.nome,codigo:x.k,produto:x.n,quantidade:x.q,funcionario:x.e,cargo:x.r}))),'Registros');XLSX.writeFile(w,'contagem_'+l.nome.replace(/\W+/g,'_')+'_'+new Date().toISOString().slice(0,10)+'.xlsx')}
function tpl(){const w=XLSX.utils.book_new(),a=(n,d)=>XLSX.utils.book_append_sheet(w,XLSX.utils.json_to_sheet(d),n);a('Produtos',[{codigo_barras:'7891234567890',sku:'SKU001',produto:'Produto exemplo',imagem_url:'',estoque_sistema:10,ultima_venda:'15/08/2026'}]);a('Lojas',[{nome:'Loja 01'}]);a('CDs',[{nome:'CD 01'}]);a('Funcionarios',[{nome:'Maria Silva',cargo:'Conferente'}]);XLSX.writeFile(w,'modelo_contacerta.xlsx')}
function clr(){modal('Zerar a contagem deste local?',[],{},()=>{S.logs[S.cur.l]=[];save();go()})}

/* telas */
const vContar=()=>`<div class="card"><div id="last"></div><div class="row" style="margin-top:8px"><input id="qty" type="number" value="1" inputmode="numeric"><button class="b" onclick="commit($('#qty').value)">Lançar</button><button class="b g" onclick="undo()">Desfazer</button></div><label class="mu"><input type="checkbox" style="width:auto" ${S.auto?'checked':''} onchange="S.auto=this.checked?1:0;save()"> +1 automático a cada bip</label></div><div class="card"><b>Últimos lançamentos</b><div id="hist"></div></div><div class="card dock"><button class="b" id="bcam" onclick="toggleCam()">📷 Abrir leitor</button><div id="cam" style="max-width:380px;margin:8px auto"></div><input id="man" placeholder="Código manual ou leitor USB + Enter" onkeydown="if(event.key==='Enter'){onCode(this.value);this.value=''}"></div>`;
function vPainel(){const r=rows(),act=r.filter(x=>x.cnt||S.z),dv=act.filter(x=>x.d).sort((a,b)=>Math.abs(b.d)-Math.abs(a.d)),pen=r.filter(x=>!x.cnt).length,acc=act.length?Math.round((act.length-dv.length)/act.length*100):0,ag=x=>x.u?Math.floor((Date.now()-new Date(x.u))/864e5):-1,sg=(a,b)=>r.filter(x=>x.q>0&&ag(x)>=a&&ag(x)<b),mx=Math.max(1,...dv.slice(0,10).map(x=>Math.abs(x.d))),ks=[['Produtos na planilha',P().length,''],['Contados',r.length-pen,''],['Divergentes',dv.length,'bad'],['Acurácia',acc+'%','ok'],['Pendentes',pen,'wa']];
return `<div class="card"><div class="grid">${ks.map(k=>`<div><div class="k ${k[2]}">${k[1]}</div><div class="mu">${k[0]}</div></div>`).join('')}</div><label class="mu"><input type="checkbox" style="width:auto" ${S.z?'checked':''} onchange="S.z=this.checked?1:0;save();go()"> Tratar não contados como zero (fim da contagem)</label></div>
<div class="card"><b>Maiores divergências</b>${dv.slice(0,10).map(x=>`<div style="margin:8px 0"><div class="mu">${esc(x.n)} · sistema ${x.q} / contado ${x.cnt} (${x.d>0?'+':''}${x.d})</div><div class="bar" style="width:${Math.max(4,Math.abs(x.d)/mx*100)}%;background:var(${x.d>0?'--wa':'--bad'})"></div></div>`).join('')||'<div class="mu">Sem divergências até agora.</div>'}</div>
<div class="card"><b>Sem giro (estoque parado)</b><div class="grid" style="margin:8px 0">${[[30,60,'30–59 dias'],[60,90,'60–89 dias'],[90,1e9,'90+ dias']].map(b=>`<div><div class="k wa">${sg(b[0],b[1]).length}</div><div class="mu">${b[2]}</div></div>`).join('')}</div>${P().some(p=>p.u)?tbl(sg(30,1e9).sort((a,b)=>ag(b)-ag(a)).slice(0,50),x=>[x.n,x.q,ag(x)+' dias'],['Produto','Estoque','Sem vender']):'<div class="mu">Adicione a coluna ultima_venda na planilha para ver este quadro.</div>'}</div>
<div class="card"><b>Divergências (detalhe)</b>${tbl(dv,x=>[x.k,x.n,x.q,x.cnt,(x.d>0?'+':'')+x.d],['Cód','Produto','Sist.','Cont.','Dif.'])}</div>`}
function vCad(){const l=loc(),row=(a,b,c)=>`<div class="row" style="margin:6px 0;flex-wrap:nowrap"><span style="flex:1">${a}</span><button class="b g" style="flex:0" onclick="${b}">Editar</button><button class="b r" style="flex:0" onclick="${c}">Excluir</button></div>`;
return `<div class="card"><b>Planilha de: ${esc(l?l.nome:'— crie um local abaixo')}</b><p class="mu">${P().length} produtos carregados · ${L().length} lançamentos</p><div class="row"><label class="b">📥 Carregar planilha<input type="file" accept=".xlsx,.xls,.csv" hidden onchange="imp(this.files[0]);this.value=''"></label><button class="b g" onclick="exp()">📤 Exportar contagem</button><button class="b g" onclick="tpl()">📄 Modelo .xlsx</button></div><div class="row" style="margin-top:8px"><button class="b g" onclick="clr()">Zerar contagem deste local</button></div></div>
<div class="card"><b>Lojas e CDs</b>${S.locs.map(x=>row((x.tipo==='CD'?'🏭 ':'🏬 ')+esc(x.nome),`edLoc('${x.id}')`,`delLoc('${x.id}')`)).join('')}<button class="b" onclick="edLoc()">+ Novo local</button></div>
<div class="card"><b>Funcionários</b>${S.emps.map(e=>row(`<span class="row" style="flex-wrap:nowrap">${av(e)}<span style="flex:1">${esc(e.nome)} <span class="mu">${esc(e.cargo)}</span></span></span>`,`edEmp('${e.id}')`,`delEmp('${e.id}')`)).join('')}<button class="b" onclick="edEmp()">+ Novo funcionário</button></div>
<div class="card"><b>Cargos</b>${S.roles.map((r,i)=>row(esc(r),`edRole(${i})`,`delRole(${i})`)).join('')}<button class="b" onclick="edRole()">+ Novo cargo</button></div>`}
async function go(t){await stopCam();tab=t||tab;const e=emp();$('#loc').innerHTML=S.locs.map(l=>`<option value="${l.id}" ${l.id===S.cur.l?'selected':''}>${esc(l.tipo)} · ${esc(l.nome)}</option>`).join('')||'<option>Sem local</option>';$('#me').innerHTML=e?`<span><b>${esc(e.nome)}</b><br>${esc(e.cargo)}</span>${av(e)}`:'<b>Entrar</b>';
$('#nav').innerHTML=[['contar','📷 Contar'],['painel','📊 Painel'],['cad','⚙️ Cadastros']].map(x=>`<button class="${x[0]===tab?'on':''}" onclick="go('${x[0]}')">${x[1]}</button>`).join('');const v=$('#v');v.className=tab;v.innerHTML=tab==='contar'?vContar():tab==='painel'?vPainel():vCad();if(tab==='contar')paint()}
go();if(!emp())openLogin();
</script></body></html>
